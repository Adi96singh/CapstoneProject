<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — SolveIt</title>
<meta name="description" content="Set a new password for your SolveIt account." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="auth-card">
  <div class="auth-panel">
    <div class="auth-logo">
      <div class="auth-logo-mark">⚡</div>
      <span class="auth-logo-text">SolveIt</span>
    </div>

    <h2>Set new password</h2>

    <form id="reset-form">
      <div class="form-group">
        <label for="newPassword">New password</label>
        <div class="password-wrapper">
          <input type="password" id="newPassword" placeholder="Min. 8 characters" minlength="8" required autocomplete="new-password" />
          <button type="button" class="password-toggle" title="Show/hide password">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Reset password</button>
    </form>

    <div class="auth-switch"><a href="/login.html">← Back to login</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
