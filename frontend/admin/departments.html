<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Departments — SolveIt Admin</title>
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>
<div class="container">
  <h2>Admin console</h2>
  <div class="admin-tabs">
    <a href="/admin/analytics.html" data-tab="analytics">Analytics</a>
    <a href="/admin/users.html" data-tab="users">Users</a>
    <a href="/admin/staff.html" data-tab="staff">Staff workload</a>
    <a href="/admin/categories.html" data-tab="categories">Categories</a>
    <a href="/admin/departments.html" data-tab="departments">Departments</a>
    <a href="/admin/sla-rules.html" data-tab="sla-rules">SLA rules</a>
    <a href="/admin/escalations.html" data-tab="escalations">Escalations</a>
    <a href="/admin/audit-logs.html" data-tab="audit-logs">Audit logs</a>
  </div>
  <h3 class="mb-3">Departments</h3>
  <div class="card mb-4">
    <h4>Add department</h4>
    <form id="department-form" class="flex gap-2" style="flex-wrap:wrap;align-items:flex-end;">
      <div class="form-group" style="flex:1;min-width:160px;"><label>Name</label><input type="text" name="name" required /></div>
      <div class="form-group" style="flex:2;min-width:200px;"><label>Description</label><input type="text" name="description" /></div>
      <button type="submit" class="btn btn-primary" style="margin-bottom:16px;">Add</button>
    </form>
  </div>
  <div id="departments-root"></div>
</div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/admin.js"></script>
<script>
  renderNavbar('admin');
  initAdminDepartments();
  document.querySelector('[data-tab="departments"]').classList.add('active');
</script>
</body>
</html>
