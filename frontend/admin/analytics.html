<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — SolveIt Admin</title>
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>
<div class="container">
  <h2>Admin console</h2>
  <div class="admin-tabs">

    <a href="/admin/users.html" data-tab="users">Users</a>
    <a href="/admin/staff.html" data-tab="staff">Staff workload</a>

  <div class="flex-between mb-3">
    <h3>Analytics</h3>
    <select id="period-select">
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="90d">Last 90 days</option>
    </select>
  </div>
  <div id="analytics-root"></div>
</div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/admin.js"></script>
<script>
  renderNavbar('admin');
  initAdminAnalytics();
  document.querySelector('[data-tab="analytics"]').classList.add('active');
</script>
</body>
</html>
