<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — SolveIt</title>
<meta name="description" content="Create a SolveIt account to file and track complaints or manage resolutions as staff." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="auth-card">
  <div class="auth-panel">
    <div class="auth-logo">
      <div class="auth-logo-mark">⚡</div>
      <span class="auth-logo-text">SolveIt</span>
    </div>

    <h2>Create an account</h2>

    <form id="register-form">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jane Smith" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password <span class="text-faint" id="strength-label"></span></label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Min. 8 characters" minlength="8" required autocomplete="new-password" />
          <button type="button" class="password-toggle" title="Show/hide password">👁</button>
        </div>
        <div class="strength-bar mt-2">
          <div class="strength-fill" id="strength-fill" style="width:0%"></div>
        </div>
      </div>
      <div class="form-group">
        <label for="role">I am a…</label>
        <select id="role">
          <option value="user">Resident / Student (filing complaints)</option>
          <option value="staff">Staff (resolving complaints)</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
