<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password — SolveIt</title>
<meta name="description" content="Reset your SolveIt account password." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="auth-card">
  <div class="auth-panel">
    <div class="auth-logo">
      <div class="auth-logo-mark">⚡</div>
      <span class="auth-logo-text">SolveIt</span>
    </div>

    <h2>Forgot password?</h2>
    <p class="text-muted text-sm text-center" style="margin-bottom: var(--space-5)">Enter your email and we'll send a reset link. In dev mode it's logged to console instead of sent.</p>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Send reset link</button>
    </form>

    <div class="auth-switch"><a href="/login.html">← Back to login</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
