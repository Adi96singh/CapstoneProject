<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — SolveIt</title>
<meta name="description" content="Admin overview of all complaints, SLA metrics, and analytics on SolveIt." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container" style="padding-top: var(--space-6);">
  <div class="flex-between mb-4">
    <div>
      <h2 style="margin-bottom: 4px;">Admin Dashboard</h2>
      <p class="text-muted text-sm">System-wide overview — last 7 days</p>
    </div>
    <a href="/admin/analytics.html" class="btn btn-primary btn-sm">Admin console →</a>
  </div>

  <div id="stats-row" class="stats-row">
    <div class="stat-card"><div class="skeleton skeleton-text w-40" style="height:36px"></div><div class="skeleton skeleton-text w-60 mt-2"></div></div>
    <div class="stat-card"><div class="skeleton skeleton-text w-40" style="height:36px"></div><div class="skeleton skeleton-text w-60 mt-2"></div></div>
    <div class="stat-card"><div class="skeleton skeleton-text w-40" style="height:36px"></div><div class="skeleton skeleton-text w-60 mt-2"></div></div>
  </div>

  <div class="flex-between mb-3 mt-5">
    <h3>Complaint Queue</h3>
    <a href="/complaints/list.html" class="btn btn-ghost btn-sm">View all →</a>
  </div>
  <div id="dashboard-list">
    <div class="skeleton-list">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/socket.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/complaints.js"></script>
<script src="../js/dashboard.js"></script>
<script>
  renderNavbar('dashboard');
  initAdminDashboard();
</script>
</body>
</html>
